# ===========================================================================
# Orchestration Smart Campus : Django + PostgreSQL + Redis + Mosquitto (MQTT)
# ===========================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
    ports:
      - "1883:1883"

  # --- Serveur web (API REST) ---
  web:
    build: .
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-a-changer}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DATABASE_URL: postgres://smartcampus:smartcampus@db:5432/smartcampus
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CHAMP_CHIFFREMENT_CLE: ${CHAMP_CHIFFREMENT_CLE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC_SCAN: campus/reader/scan
      SEED_ON_START: ${SEED_ON_START:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  # --- Écouteur MQTT (réception des scans de carte) ---
  mqtt_listener:
    build: .
    command: python manage.py mqtt_listener
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-a-changer}
      DATABASE_URL: postgres://smartcampus:smartcampus@db:5432/smartcampus
      DB_HOST: db
      DB_PORT: "5432"
      CHAMP_CHIFFREMENT_CLE: ${CHAMP_CHIFFREMENT_CLE:-}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC_SCAN: campus/reader/scan
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
      web:
        condition: service_started

volumes:
  donnees_postgres:
