            schema:
              $ref: '#/components/schemas/TerminalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TerminalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TerminalRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terminal'
          description: ''
    get:
      operationId: api_terminaux_list
      description: |-
        CRUD des terminaux.

        - Lecture : tout utilisateur authentifié (les terminaux ne sont pas secrets).
        - Écriture : admin uniquement.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Terminaux
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
