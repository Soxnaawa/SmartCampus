          description: ''
  /api/scolarite/payer/:
    post:
      operationId: api_scolarite_payer_create
      description: POST /api/scolarite/payer/ — enregistre un paiement (caissier).
      summary: Enregistrer un paiement de scolarité (caissier)
      tags:
      - Scolarité
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayerRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaiementScolarite'
          description: ''
  /api/scolarite/statut/{uid}/:
    get:
      operationId: api_scolarite_statut_retrieve
      description: 'Contrat de sortie FIGÉ. Ne renvoie que les champs publics du contrôle
        : aucune donnée nominative ni financière. `statut` ∈ a_jour | en_retard |
        exonere.'
      summary: Statut de scolarité pour le contrôle (contrôleur/admin)
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - Scolarité
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatutScolarite'
          description: ''
  /api/scolarite/recu/{id}/:
    get:
      operationId: api_scolarite_recu_retrieve
      description: Réservé à l'étudiant concerné ou à un administrateur. Renvoie un
        fichier PDF (application/pdf).
      summary: Télécharger le reçu PDF d'un paiement
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Scolarité
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: Le reçu au format PDF.
  /api/scolarite/exonerer/:
    post:
      operationId: api_scolarite_exonerer_create
      description: POST /api/scolarite/exonerer/ — marque un étudiant exonéré (admin).
      summary: Marquer un étudiant exonéré (admin)
      tags:
      - Scolarité
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExonererRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExonererRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExonererRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaiementScolarite'
          description: ''
  /api/iot/scan/:
    post:
      operationId: api_iot_scan_create
      description: 'Équivalent HTTP du flux MQTT. Pas de JWT : l''authentification
        est la signature de la carte. Rejette les nonces rejoués (409), les signatures
        invalides (400), les horodatages expirés (400) et les cartes inactives (403).'
      summary: Recevoir un scan de carte (signé)
      tags:
      - IoT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScanRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScanRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReponseScan'
          description: ''
  /api/etudiants/:
    post:
      operationId: api_etudiants_create
      description: |-
        CRUD des étudiants.

        - Lecture (list/retrieve) : caissier ou admin.
        - Écriture (create/update/delete) : admin uniquement.
      tags:
      - Étudiants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtudiantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EtudiantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EtudiantRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etudiant'
          description: ''
    get:
      operationId: api_etudiants_list
      description: |-
        CRUD des étudiants.

        - Lecture (list/retrieve) : caissier ou admin.
        - Écriture (create/update/delete) : admin uniquement.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Étudiants
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEtudiantResumeList'
          description: ''
  /api/etudiants/{uid_carte}/:
    delete:
      operationId: api_etudiants_destroy
      description: |-
        CRUD des étudiants.

        - Lecture (list/retrieve) : caissier ou admin.
        - Écriture (create/update/delete) : admin uniquement.
      parameters:
      - in: path
        name: uid_carte
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Étudiants
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
    put:
      operationId: api_etudiants_update
      description: |-
        CRUD des étudiants.

        - Lecture (list/retrieve) : caissier ou admin.
        - Écriture (create/update/delete) : admin uniquement.
      parameters:
      - in: path
        name: uid_carte
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Étudiants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtudiantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EtudiantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EtudiantRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etudiant'
          description: ''
    patch:
      operationId: api_etudiants_partial_update
      description: |-
        CRUD des étudiants.

        - Lecture (list/retrieve) : caissier ou admin.
        - Écriture (create/update/delete) : admin uniquement.
      parameters:
      - in: path
        name: uid_carte
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Étudiants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEtudiantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEtudiantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEtudiantRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etudiant'
          description: ''
    get:
      operationId: api_etudiants_retrieve
      description: |-
        CRUD des étudiants.

        - Lecture (list/retrieve) : caissier ou admin.
        - Écriture (create/update/delete) : admin uniquement.
      parameters:
      - in: path
        name: uid_carte
        schema:
          type: string
          pattern: ^[^/]+$
