openapi: 3.0.3
info:
  title: Smart Campus — API backend (P3)
  version: 1.0.0
  description: |-
    API REST du système universitaire Smart Campus (ESP/UCAD).

    **Authentification** : JWT (Bearer). Récupérer un token via `POST /api/auth/login/`, puis l'envoyer dans l'en-tête `Authorization: Bearer <access>`.

    **Montants** : entiers en centimes de FCFA (750 FCFA = 75000).

    **Scans signés** : les endpoints de débit et `/api/iot/scan/` exigent une enveloppe signée par la carte (nonce + signature RSA). En dev, la générer avec `python manage.py simuler_scan`.
paths:
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: Authentifie un utilisateur et renvoie un token d'accès (15 min)
        + un token de rafraîchissement, avec son rôle.
      summary: Connexion (obtenir un couple de tokens)
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JetonAvecRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JetonAvecRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JetonAvecRoleRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReponseConnexion'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: api_auth_refresh_create
      description: POST /api/auth/refresh/ → nouvel access token à partir d'un refresh.
      summary: Rafraîchir le token d'accès
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      description: POST /api/auth/logout/ → blacklist du refresh token fourni.
      summary: Déconnexion (blacklist du refresh token)
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeconnexionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeconnexionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeconnexionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Déconnecté.
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      description: GET /api/auth/me/ → profil de l'utilisateur connecté.
      summary: Profil de l'utilisateur connecté
      tags:
      - Authentification
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
          description: ''
  /api/transaction/debit/:
    post:
      operationId: api_transaction_debit_create
      description: Vérifie l'enveloppe signée par la carte (nonce, signature RSA,
        horodatage) puis débite le solde de façon atomique. Renvoie 201 si validé,
        402 si solde insuffisant (transaction tracée), 409 en cas de rejeu de nonce.
      summary: Débiter une carte (caissier + signature carte)
      tags:
      - Monétique
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebitRequest'
            examples:
              DébitSigné:
                value:
                  uid: SC-2025-00001
                  terminal_id: RESTO-01
                  timestamp: 1718450000000
                  nonce: a1b2…(hex)
                  signature: Base64Signature==
                  montant: 15000
                summary: Débit signé
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DebitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DebitRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
  /api/transaction/credit/:
    post:
      operationId: api_transaction_credit_create
      description: 'Recharge au guichet : pas de signature carte requise. Crée une
        transaction de crédit et incrémente le solde de façon atomique.'
      summary: Recharger un solde (caissier ou admin)
      tags:
      - Monétique
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreditRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreditRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
  /api/solde/{uid}/:
    get:
      operationId: api_solde_retrieve
      description: Accessible à l'étudiant propriétaire ou à un administrateur.
      summary: Consulter le solde d'une carte
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - Monétique
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solde'
          description: ''
  /api/transactions/{uid}/:
    get:
      operationId: api_transactions_list
      description: Liste paginée des transactions d'une carte. Accessible à l'étudiant
        propriétaire ou à un administrateur. Filtres optionnels.
      summary: Historique des transactions (paginé)
      parameters:
      - in: query
        name: date_debut
        schema:
          type: string
        description: Date min (AAAA-MM-JJ).
      - in: query
        name: date_fin
        schema:
          type: string
        description: Date max (AAAA-MM-JJ).
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: statut
        schema:
          type: string
        description: valide | refuse | suspect | annule
      - in: query
        name: type
        schema:
          type: string
        description: debit | credit | remboursement
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - Monétique
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionList'
          description: ''
  /api/carte/bloquer/:
    post:
      operationId: api_carte_bloquer_create
      description: POST /api/carte/bloquer/ — bloque une carte (admin).
      summary: Bloquer une carte (admin)
      tags:
      - Monétique
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloquerCarteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloquerCarteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloquerCarteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReponseBlocage'
          description: ''
  /api/stats/dashboard/:
    get:
      operationId: api_stats_dashboard_retrieve
      description: GET /api/stats/dashboard/ — KPIs globaux (admin).
      summary: Tableau de bord — KPIs globaux (admin)
      tags:
      - Monétique
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
