  /api/terminaux/{code}/:
    delete:
      operationId: api_terminaux_destroy
      description: |-
        CRUD des terminaux.

        - Lecture : tout utilisateur authentifié (les terminaux ne sont pas secrets).
        - Écriture : admin uniquement.
      parameters:
      - in: path
        name: code
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Terminaux
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
    put:
      operationId: api_terminaux_update
      description: |-
        CRUD des terminaux.

        - Lecture : tout utilisateur authentifié (les terminaux ne sont pas secrets).
        - Écriture : admin uniquement.
      parameters:
      - in: path
        name: code
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Terminaux
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TerminalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TerminalRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terminal'
          description: ''
    patch:
      operationId: api_terminaux_partial_update
      description: |-
        CRUD des terminaux.

        - Lecture : tout utilisateur authentifié (les terminaux ne sont pas secrets).
        - Écriture : admin uniquement.
      parameters:
      - in: path
        name: code
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Terminaux
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTerminalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTerminalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTerminalRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terminal'
          description: ''
    get:
      operationId: api_terminaux_retrieve
      description: |-
        CRUD des terminaux.

        - Lecture : tout utilisateur authentifié (les terminaux ne sont pas secrets).
        - Écriture : admin uniquement.
      parameters:
      - in: path
        name: code
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Terminaux
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terminal'
          description: ''
components:
  schemas:
    BloquerCarteRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - uid
    CreditRequest:
      type: object
      description: 'Entrée de la recharge (pas de signature carte : opération guichet).'
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 20
        montant:
          type: integer
          minimum: 1
        terminal_id:
          type: string
          minLength: 1
          maxLength: 20
        metadata: {}
      required:
      - montant
      - uid
    DebitRequest:
      type: object
      description: 'Entrée du débit : enveloppe signée + montant à débiter.'
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 20
        terminal_id:
          type: string
          minLength: 1
          maxLength: 20
        timestamp:
          type: integer
          description: Epoch en millisecondes.
        nonce:
          type: string
          minLength: 1
          maxLength: 64
        signature:
          type: string
          minLength: 1
        montant:
          type: integer
          minimum: 1
          description: Montant en centimes FCFA (> 0).
      required:
      - montant
      - nonce
      - signature
      - terminal_id
      - timestamp
      - uid
    DeconnexionRequest:
      type: object
      description: 'Entrée du logout : le refresh token à blacklister.'
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Etudiant:
      type: object
      description: |-
        Fiche étudiant complète (usage administratif).

        Les champs `nom`, `prenom`, `matricule` sont exposés en clair : ils
        correspondent aux propriétés du modèle qui chiffrent/déchiffrent
        automatiquement vers les colonnes `*_chiffre`. Ce serializer ne doit servir
        qu'aux rôles autorisés (admin/caissier), jamais au contrôle public.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          title: Identifiant
        uid_carte:
          type: string
          title: UID de la carte
          description: 'Identifiant unique de la carte physique, ex : SC-2025-00147.'
          maxLength: 20
        nom:
          type: string
          maxLength: 100
        prenom:
          type: string
          maxLength: 100
        matricule:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 255
        filiere:
          type: string
          title: Filière
          maxLength: 100
        statut:
          allOf:
          - $ref: '#/components/schemas/StatutCarteEnum'
          title: Statut de la carte
        certificat_pub:
